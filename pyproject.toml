[project]
name = "transparentml"
version = "0.1.0"
description = "Transparent ML is a simple and lightweight machine learning library."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Sourav Banerjee", email = "souravbnjee07@gmail.com" }
]
keywords = ["machine-learning", "from-scratch", "education", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.5.1",
]

[project.urls]
Repository = "https://github.com/Sou2002/ml_concepts"
Issues = "https://github.com/Sou2002/ml_concepts/issues"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["N803", "N806"]
# E = pycodestyle errors, F = pyflakes, I = import sorting,
# N = naming conventions, UP = pyupgrade, B = bugbear (common bug patterns)

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transparentml"]
